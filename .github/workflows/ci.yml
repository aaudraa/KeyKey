name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  kalite:
    name: Kod kalitesi
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # libsodium'u her seferinde yeniden derlememek için.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-linux-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Biçim
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analiz
        run: flutter analyze
      - name: Test
        run: flutter test

  android:
    name: Android derlemesi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-android-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Yayın APK'sı
        run: flutter build apk --release --target-platform android-arm64,android-x64
      - name: APK güvenlik denetimi
        run: bash resources/scripts/check-release-apk.sh
      # Otomatik doldurmanın saf Kotlin kısımları. Gradle ayarlarını bir önceki
      # flutter build adımı hazırlar.
      - name: Kotlin birim testleri
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest --console=plain

  gizli-bilgi:
    name: Gizli bilgi taraması
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks kur
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: Tüm geçmişi tara
        run: ./gitleaks detect --source . --config resources/gitleaks.toml --redact --verbose --no-banner --exit-code 1
