# KeyKey'in kendi F-Droid deposu: https://aaudraa.github.io/KeyKey/fdroid/repo
#
# Bir sürüm yayımlanınca (taslaklar "published" olayı üretmez) depo, en yeni
# üç yayımlanmış sürümden baştan kurulur, depo anahtarıyla imzalanır ve
# GitHub Pages'e yüklenir. Elle çalıştırmak için iş akışı bir v* etiketinde
# başlatılır (ortamlar yalnızca v* etiketlerine açık).
# Tasarım: resources/docs/dagitim.md; prova: f-droid.yml "Depo provası".
name: F-Droid deposu

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-deposu
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  kur:
    name: Depoyu kur ve imzala
    # Ön sürümler (deneme ve Obtainium denemesi gibi) depoya girmez.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Depo anahtarı bu ortamın gizli değerlerinde; ortam yalnızca v* etiketlerine açık.
    environment: fdroid-deposu
    container:
      # f-droid.yml'daki "bizim" ve "Depo provası" işleriyle aynı özet.
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - name: Araçlar
        run: |
          apt-get update -qq
          apt-get install -qy gh openjdk-21-jdk-headless >/dev/null
          # apksigner imajda yok; derleme işinde onu Gradle kuruyor.
          # shellcheck disable=SC1091
          source /etc/profile.d/bsenv.sh
          sdkmanager --install "build-tools;36.0.0" >/dev/null
      - name: Anahtarı hazırla
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${FDROID_KEYSTORE_BASE64}" ]]; then
            echo "HATA: fdroid-deposu ortamında FDROID_KEYSTORE_BASE64 yok." >&2
            exit 1
          fi
          umask 077
          printf '%s' "${FDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/depo.jks"
      - name: Depoyu kur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          # shellcheck disable=SC1091
          source /etc/profile.d/bsenv.sh
          export ANDROID_HOME=/opt/android-sdk
          export FDROID_KEYSTORE="${RUNNER_TEMP}/depo.jks"
          bash resources/scripts/fdroid-deposu-kur.sh --kur --surumler 3 --cikti site
      - name: Anahtarı sil
        if: always()
        run: rm -f "${RUNNER_TEMP}/depo.jks"
      - name: İndeksi doğrula
        run: bash resources/scripts/fdroid-deposu-dogrula.sh site/fdroid/repo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  yayimla:
    name: GitHub Pages'e yayımla
    needs: kur
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}fdroid/repo
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
