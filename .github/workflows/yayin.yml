name: Yayın

# v ile başlayan bir etiket gönderilince APK ve AAB'yi F-Droid'in derleme
# yolunda imzasız derler, yayın anahtarıyla imzalar, denetler ve taslak bir
# GitHub Release oluşturur. Aynı commit'i F-Droid'in kendi aracı da derler;
# "F-Droid karşılaştırması" yeşil olmadan taslak yayımlanmaz. Taslağı
# yayımlamak elle yapılır.
# Ayrıntılar: resources/docs/yayin.md, resources/docs/f-droid.md
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: yayin-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}
  IMAGE: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie

jobs:
  # Derleme anahtara erişmez; F-Droid'in derleme imajında, F-Droid'in
  # derleyeceği yolda ve tarifteki adımlarla yapılır.
  derle:
    name: Derleme (F-Droid yolunda, imzasız)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - name: Sürüm denetimi
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*$/\1/p' pubspec.yaml)"
          if [[ "v${version}" != "${TAG}" ]]; then
            echo "HATA: etiket ${TAG}, pubspec.yaml sürümü ${version}." >&2
            exit 1
          fi
      - name: APK ve AAB
        run: bash resources/scripts/f-droid-yolunda-derle.sh "$GITHUB_SHA" out/imzasiz.apk appbundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imzasiz
          path: out/
          if-no-files-found: error

  f-droid:
    name: F-Droid derlemesi (fdroid build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - name: fdroid build
        run: bash resources/scripts/f-droid-derle.sh "$GITHUB_SHA" out/fdroid.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid
          path: out/fdroid.apk
          if-no-files-found: error

  yayin:
    name: İmzalı yayın
    needs: derle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Anahtar bu ortamın gizli değerlerinde. Ortam yalnızca v* etiketlerine
    # açık; başka bir dal ya da PR anahtara erişemez.
    environment: yayin
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*$/\1/p' pubspec.yaml)"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imzasiz
          path: out

      - name: Anahtarı hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYKEY_KEYSTORE_BASE64 }}
          KEYKEY_KEYSTORE_PASSWORD: ${{ secrets.KEYKEY_KEYSTORE_PASSWORD }}
          KEYKEY_KEY_ALIAS: ${{ secrets.KEYKEY_KEY_ALIAS }}
          KEYKEY_KEY_PASSWORD: ${{ secrets.KEYKEY_KEY_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "HATA: yayin ortamında KEYKEY_KEYSTORE_BASE64 yok." >&2
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/keykey.jks"
          echo "KEYKEY_KEYSTORE=${RUNNER_TEMP}/keykey.jks" >> "$GITHUB_ENV"
          # Parolalar imzalamadan önce denenir. -certreq özel anahtarı da açar.
          if ! keytool -certreq -keystore "${RUNNER_TEMP}/keykey.jks" \
              -alias "${KEYKEY_KEY_ALIAS}" \
              -storepass:env KEYKEY_KEYSTORE_PASSWORD \
              -keypass:env KEYKEY_KEY_PASSWORD >/dev/null 2>&1; then
            echo "HATA: anahtar deposu ya da anahtar yayin ortamındaki parolalarla açılmıyor." >&2
            exit 1
          fi

      # apksigner zip içeriğine dokunmaz, yalnızca imza bloğunu ekler; bu yüzden
      # F-Droid imzayı kendi imzasız derlemesine kopyalayıp doğrulayabilir.
      # Şemalar açıkça yazılı: v1 (JAR) imzası META-INF'e dosya ekler, Android
      # 11+ için gereksiz; 1.0.0'da Gradle de eklemiyordu. Hizalama korunur:
      # derleme zaten hizalı, apksigner yeniden hizalarsa yerleşim değişir.
      - name: İmzala
        env:
          KEYKEY_KEYSTORE_PASSWORD: ${{ secrets.KEYKEY_KEYSTORE_PASSWORD }}
          KEYKEY_KEY_ALIAS: ${{ secrets.KEYKEY_KEY_ALIAS }}
          KEYKEY_KEY_PASSWORD: ${{ secrets.KEYKEY_KEY_PASSWORD }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner" sign --ks "$KEYKEY_KEYSTORE" --ks-key-alias "$KEYKEY_KEY_ALIAS" \
            --ks-pass env:KEYKEY_KEYSTORE_PASSWORD --key-pass env:KEYKEY_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --alignment-preserved true \
            --in out/imzasiz.apk --out out/keykey.apk
          jarsigner -keystore "$KEYKEY_KEYSTORE" \
            -storepass:env KEYKEY_KEYSTORE_PASSWORD -keypass:env KEYKEY_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar out/keykey.aab out/imzasiz.aab "$KEYKEY_KEY_ALIAS" >/dev/null

      - name: Anahtarı sil
        if: always()
        run: rm -f "${RUNNER_TEMP}/keykey.jks"

      - name: APK güvenlik denetimi
        run: bash resources/scripts/check-release-apk.sh out/keykey.apk

      - name: İmza denetimi
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs out/keykey.apk | tee imza.txt
          if grep -q "CN=Android Debug" imza.txt; then
            echo "HATA: APK debug anahtarıyla imzalanmış." >&2
            exit 1
          fi
          # --verbose ile satır "V2 Signer: certificate SHA-256 digest: ...", onsuz
          # "Signer #1 certificate SHA-256 digest: ..." biçiminde.
          cert="$(sed -n -E 's/^(V2 Signer:|Signer #1) certificate SHA-256 digest: //p' imza.txt | head -n 1)"
          if [[ -z "$cert" ]]; then
            echo "HATA: sertifika özeti okunamadı." >&2
            exit 1
          fi
          echo "CERT_SHA256=${cert}" >> "$GITHUB_ENV"
          jarsigner -verify out/keykey.aab >/dev/null

      - name: Dosyaları topla
        run: |
          mkdir dist
          cp out/keykey.apk "dist/keykey-${VERSION}.apk"
          cp out/keykey.aab "dist/keykey-${VERSION}.aab"
          cp out/imzasiz-mapping.txt "dist/keykey-${VERSION}-mapping.txt"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imzali
          path: dist/keykey-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Taslak GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          apk_sha="$(sed -n "s/  keykey-${VERSION}\.apk$//p" dist/SHA256SUMS)"
          cat > notlar.md <<EOF
          ## Doğrulama

          APK'nın SHA-256 özeti:

          \`\`\`
          ${apk_sha}
          \`\`\`

          İmza sertifikasının SHA-256 özeti:

          \`\`\`
          ${CERT_SHA256}
          \`\`\`

          Bu sürümü yayın iş akışı (\`.github/workflows/yayin.yml\`) \`${GITHUB_SHA}\` commit'inden, F-Droid'in derleme imajında ve derleme yolunda derledi; aynı commit'i F-Droid'in kendi aracı da derleyip bu APK'yla karşılaştırdı. \`mapping.txt\` yalnızca hata raporlarındaki yığın izlerini okumak içindir, kurulmaz.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag "${prerelease[@]}" \
            --title "KeyKey ${VERSION}" \
            --notes-file notlar.md

  # Taslak yayımlanmadan önce: F-Droid'in derlemesi bizim imzamızı kabul
  # ediyor mu. Kırmızıysa taslak yayımlanmaz (resources/docs/yayin.md).
  karsilastir:
    name: F-Droid karşılaştırması
    needs: [yayin, f-droid]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - run: |
          apt-get update -qq && apt-get install -qy apksigcopier >/dev/null
          sha256sum out/*.apk
          bash resources/scripts/f-droid-karsilastir.sh out/keykey-*.apk out/fdroid.apk
