name: Yayın

# v ile başlayan bir etiket gönderilince APK ve AAB'yi F-Droid'in derleme
# yolunda imzasız derler, yayın anahtarıyla imzalar, denetler ve aynı commit'in
# F-Droid'in kendi aracıyla derlenmiş haliyle karşılaştırır. Karşılaştırma
# yeşilse taslak bir GitHub Release oluşturur; taslağı yayımlamak elle yapılır.
# Zincirin tek kullanımlık anahtarla provası: f-droid.yml.
# Ayrıntılar: resources/docs/yayin.md, resources/docs/f-droid.md
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: yayin-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}

jobs:
  # Derleme anahtara erişmez; F-Droid'in derleme imajında (sabit özet),
  # F-Droid'in derleyeceği yolda ve tarifteki adımlarla yapılır.
  derle:
    name: Derleme (F-Droid yolunda, imzasız)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # f-droid.yml'daki "bizim" işiyle aynı özet. Güncellemesi: resources/docs/yayin.md
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - name: Sürüm ve mağaza açıklamaları
        env:
          PYTHONIOENCODING: utf-8
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*$/\1/p' pubspec.yaml)"
          if [[ "v${version}" != "${TAG}" ]]; then
            echo "HATA: etiket ${TAG}, pubspec.yaml sürümü ${version}." >&2
            exit 1
          fi
          python3 resources/scripts/check-fastlane.py
      - name: APK ve AAB
        run: bash resources/scripts/f-droid-yolunda-derle.sh "$GITHUB_SHA" out/imzasiz.apk appbundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imzasiz
          path: out/
          if-no-files-found: error

  # F-Droid'in aracı, imajın güncel haliyle: F-Droid'in bugün derleyeceği APK.
  f-droid:
    name: F-Droid derlemesi (fdroid build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - name: fdroid build
        run: bash resources/scripts/f-droid-derle.sh "$GITHUB_SHA" out/fdroid.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid
          path: out/fdroid.apk
          if-no-files-found: error

  yayin:
    name: İmzalı yayın
    needs: derle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Anahtar bu ortamın gizli değerlerinde. Ortam yalnızca v* etiketlerine
    # açık; başka bir dal ya da PR anahtara erişemez.
    environment: yayin
    outputs:
      version: ${{ steps.surum.outputs.version }}
      cert: ${{ steps.denetim.outputs.cert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - id: surum
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*$/\1/p' pubspec.yaml)"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imzasiz
          path: out

      - name: Anahtarı hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYKEY_KEYSTORE_BASE64 }}
          KEYKEY_KEYSTORE_PASSWORD: ${{ secrets.KEYKEY_KEYSTORE_PASSWORD }}
          KEYKEY_KEY_ALIAS: ${{ secrets.KEYKEY_KEY_ALIAS }}
          KEYKEY_KEY_PASSWORD: ${{ secrets.KEYKEY_KEY_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "HATA: yayin ortamında KEYKEY_KEYSTORE_BASE64 yok." >&2
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/keykey.jks"
          echo "KEYKEY_KEYSTORE=${RUNNER_TEMP}/keykey.jks" >> "$GITHUB_ENV"
          # Parolalar imzalamadan önce denenir. -certreq özel anahtarı da açar.
          if ! keytool -certreq -keystore "${RUNNER_TEMP}/keykey.jks" \
              -alias "${KEYKEY_KEY_ALIAS}" \
              -storepass:env KEYKEY_KEYSTORE_PASSWORD \
              -keypass:env KEYKEY_KEY_PASSWORD >/dev/null 2>&1; then
            echo "HATA: anahtar deposu ya da anahtar yayin ortamındaki parolalarla açılmıyor." >&2
            exit 1
          fi

      - name: İmzala
        env:
          KEYKEY_KEYSTORE_PASSWORD: ${{ secrets.KEYKEY_KEYSTORE_PASSWORD }}
          KEYKEY_KEY_ALIAS: ${{ secrets.KEYKEY_KEY_ALIAS }}
          KEYKEY_KEY_PASSWORD: ${{ secrets.KEYKEY_KEY_PASSWORD }}
        run: bash resources/scripts/imzala.sh out/imzasiz.apk out/keykey.apk out/imzasiz.aab out/keykey.aab

      - name: Anahtarı sil
        if: always()
        run: rm -f "${RUNNER_TEMP}/keykey.jks"

      - name: APK güvenlik denetimi
        run: bash resources/scripts/check-release-apk.sh out/keykey.apk

      # Sertifika, F-Droid tarifindeki AllowedAPKSigningKeys ile aynı olmalı;
      # başka bir anahtarla imzalı APK'yı F-Droid kabul etmez.
      - id: denetim
        name: İmza denetimi
        run: |
          cert="$(bash resources/scripts/imza-ozeti.sh out/keykey.apk)"
          expected="$(sed -n 's/^AllowedAPKSigningKeys: *//p' resources/f-droid/io.github.aaudraa.keykey.yml | tr -d '[:space:]')"
          if [[ -z "$cert" || "$cert" != "$expected" ]]; then
            echo "HATA: imza sertifikası '${cert}', beklenen '${expected}' (F-Droid tarifi)." >&2
            exit 1
          fi
          echo "cert=${cert}" >> "$GITHUB_OUTPUT"

      - name: Dosyaları topla
        run: |
          mkdir dist
          cp out/keykey.apk "dist/keykey-${VERSION}.apk"
          cp out/keykey.aab "dist/keykey-${VERSION}.aab"
          cp out/imzasiz-mapping.txt "dist/keykey-${VERSION}-mapping.txt"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  karsilastir:
    name: F-Droid karşılaştırması
    needs: [yayin, f-droid]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fdroid
          path: out
      - run: |
          apt-get update -qq && apt-get install -qy apksigcopier >/dev/null
          sha256sum dist/*.apk out/*.apk
          bash resources/scripts/f-droid-karsilastir.sh dist/keykey-*.apk out/fdroid.apk

  # Taslak ancak F-Droid karşılaştırması yeşilse oluşur.
  taslak:
    name: Taslak GitHub Release
    needs: [yayin, karsilastir]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.yayin.outputs.version }}
          CERT_SHA256: ${{ needs.yayin.outputs.cert }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          apk_sha="$(sed -n "s/  keykey-${VERSION}\.apk$//p" dist/SHA256SUMS)"
          if [[ -z "$apk_sha" || -z "$CERT_SHA256" ]]; then
            echo "HATA: APK özeti ya da sertifika özeti boş." >&2
            exit 1
          fi
          cat > notlar.md <<EOF
          ## Doğrulama

          APK'nın SHA-256 özeti:

          \`\`\`
          ${apk_sha}
          \`\`\`

          İmza sertifikasının SHA-256 özeti:

          \`\`\`
          ${CERT_SHA256}
          \`\`\`

          Bu sürümü yayın iş akışı (\`.github/workflows/yayin.yml\`) \`${GITHUB_SHA}\` commit'inden, F-Droid'in derleme imajında ve derleme yolunda derledi; aynı commit'i F-Droid'in kendi aracı da derledi ve bu APK'yla bayt bayt aynı çıktı. \`mapping.txt\` yalnızca hata raporlarındaki yığın izlerini okumak içindir, kurulmaz.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag "${prerelease[@]}" \
            --title "KeyKey ${VERSION}" \
            --notes-file notlar.md
