version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["alan: altyapı"]
    commit-message:
      prefix: altyapı
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["alan: android"]
    commit-message:
      prefix: altyapı
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["alan: altyapı"]
    commit-message:
      prefix: altyapı
