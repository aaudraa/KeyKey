name: keykey
description: "Android için çevrimdışı parola yöneticisi ve 2FA doğrulama uygulaması."
publish_to: "none"
version: 1.0.0-dev+2

environment:
  sdk: ^3.13.7

dependencies:
  camera: ^0.12.2
  crypto: ^3.0.8
  drift: ^2.35.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_zxing: ^3.1.0
  go_router: ^18.1.3
  image_picker: ^1.2.4
  intl: any
  path_provider: ^2.1.6
  sodium: ^4.1.2+1
  sqlite3: ^3.9.1

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  pigeon: ^29.1.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - resources/assets/wordlists/eff_large_wordlist.txt
    - resources/assets/wordlists/common_passwords_10k.txt
    - resources/assets/licenses/zxing-cpp.txt
    - resources/assets/licenses/zint.txt
    - resources/assets/licenses/apache-2.0.txt
    - resources/assets/autofill/public_suffix_list.dat
  generate: true

# Uygulamadaki SQLite hazır kütüphane olarak indirilmez, repodaki kaynaktan
# derlenir (paketin varsayılan derleme seçenekleriyle). Kaynak ve güncelleme:
# android/third_party/sqlite/README.md. Bilgisayardaki testler paketin hazır
# kütüphanesini kullanır; uygulamaya girmez.
hooks:
  user_defines:
    sqlite3:
      source:
        android: source
        default: sqlite3
      path: android/third_party/sqlite/sqlite3.c
