name: keykey
description: "Android için çevrimdışı parola yöneticisi ve 2FA doğrulama uygulaması."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  intl: any
  path_provider: ^2.1.6
  sodium: ^4.1.2+1
  sqlite3: ^3.9.0

dev_dependencies:
  build_runner: ^2.17.1
  crypto: ^3.0.8
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  pigeon: ^29.1.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
