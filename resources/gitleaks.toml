# CI'daki gitleaks taramasının ayarları. Varsayılan kuralların hepsi geçerlidir.
[extend]
useDefault = true

# Biçim uyumluluğu testleri bilerek sabit deneme anahtarları içeriyor. Bunlar
# gerçek bir kasaya ait değil. Liste yalnızca bu dosyalarla sınırlı kalmalı.
[[allowlists]]
description = "Yalnızca deneme verisi içeren biçim uyumluluğu dosyaları"
paths = [
  '''^test/fixtures/crypto/vault-v1\.json$''',
  '''^integration_test/vault_v1_fixture\.dart$''',
  '''^test/fixtures/backup/backup-v[12]\.json$''',
]

# İçe aktarma testlerinin örnek dosyaları. Aegis ve 2FAS örnekleri Aegis
# projesinin testlerinden (GPL-3.0, parolaları "test"), AES-GCM vektörleri bu
# örneklerden üretildi; içlerindeki anahtarlar herkese açık deneme verisidir.
# Cihaz testi aynı örnekleri gömülü olarak taşır. Liste bu dosyalarla sınırlı
# kalmalı; yeni bir örnek eklenirse önce içeriği gözden geçirilir.
[[allowlists]]
description = "İçe aktarma testlerinin herkese açık örnek dosyaları"
paths = [
  '''^test/fixtures/import/aegis_(plain|encrypted)\.json$''',
  '''^test/fixtures/import/2fas_(plain|encrypted)_v[0-9]+\.2fas$''',
  '''^test/fixtures/import/aes_gcm_vectors\.json$''',
  '''^integration_test/import_fixtures\.dart$''',
  # Parola içe aktarma örnekleri: bir kısmı Bitwarden'ın içe aktarma
  # testlerinden (bitwarden/clients, GPL-3.0), diğerleri deneme verisi.
  '''^test/fixtures/import/logins/[a-z_]+\.(csv|json)$''',
  # KeePass test dosyaları ve anahtar dosyaları pykeepass (GPL-3.0) ve
  # KeePassXC (GPL-2.0/3.0) testlerinden; kaynak ve özetler
  # test/fixtures/import/kdbx/KAYNAKLAR.md'de. Cihaz testi aynılarını
  # Base64 olarak taşır (resources/scripts/kdbx-cihaz-ornekleri.py).
  '''^test/fixtures/import/kdbx/(pykeepass|keepassxc|keykey)/[\w.]+$''',
  '''^integration_test/kdbx_fixtures\.dart$''',
]

# Testlerdeki sabit deneme parolaları yanlış alarm veriyor. Dosyalara değil,
# yalnızca bu değerlere tam eşleşmeyle izin verilir; aynı dosyalardaki başka
# bir gizli bilgi yakalanmaya devam eder. Gerçek bir parola buraya eklenmez.
[[allowlists]]
description = "Testlerdeki sabit deneme parolaları"
regexes = [
  '''^dogru-Ana-Parola-47$''',
  '''^ikinci-Ana-Parola-58$''',
  '''^yepyeni-Ana-Parola-58$''',
  '''^yedek-Parolasi-55$''',
  '''^yedek-Alan-Parola-61$''',
  '''^yeni-Telefon-Parola-73$''',
  '''^Yeni-Ana-Parola-2027$''',
  '''^Telefon-B-Parola-2026$''',
  # Senkron testlerindeki deneme uygulama parolası (WebDAV).
  '''^uygulama-parolasi-123$''',
  # Bitwarden'ın içe aktarma testlerindeki herkese açık deneme değerleri.
  '''^wpC9qFvsbWQK5Z$''',
  '''^Qh6W4Wz55YGFNU$''',
  '''^ABCD1234EFGH5678$''',
  # KeePass içe aktarma testlerinin herkese açık deneme TOTP anahtarı
  # (RFC 4226'daki "12345678901234567890"ın ilk 10 baytı, Base32).
  '''^GEZDGNBVGY3TQOJQ$''',
]

# SQLite'ın değiştirilmemiş kaynağı. "sqlite3_api->xxx" ve "iKey==xxx" gibi C
# kodları genel anahtar kuralına takılıyor. Dosya sqlite.org'un yayımladığı
# özetle doğrulanır (resources/scripts/sqlite-guncelle.sh --denetle); izin
# yalnızca bu dosyayı kapsar.
[[allowlists]]
description = "SQLite'ın değiştirilmemiş kaynak dosyası"
paths = [
  '''^android/third_party/sqlite/sqlite3\.c$''',
]

# KeyKey yayın sertifikasının SHA-256 özeti. Gizli değil: README'de ve yayın
# notlarında herkese açık; F-Droid tarifinde AllowedAPKSigningKeys olarak
# geçince genel anahtar kuralına takılıyor. Yalnızca bu değere tam eşleşmeyle
# izin verilir.
[[allowlists]]
description = "Yayın sertifikasının herkese açık SHA-256 özeti"
regexes = [
  '''^66ff7b5c0c009a8530d0a55dd1d80a3af35de48bd0667c456a0cf86a6d1129a0$''',
]
