# CI'daki gitleaks taramasının ayarları. Varsayılan kuralların hepsi geçerlidir.
[extend]
useDefault = true

# Biçim uyumluluğu testleri bilerek sabit deneme anahtarları içeriyor. Bunlar
# gerçek bir kasaya ait değil. Liste yalnızca bu dosyalarla sınırlı kalmalı.
[[allowlists]]
description = "Yalnızca deneme verisi içeren biçim uyumluluğu dosyaları"
paths = [
  '''^test/fixtures/crypto/vault-v1\.json$''',
  '''^integration_test/vault_v1_fixture\.dart$''',
  '''^test/fixtures/backup/backup-v1\.json$''',
]

# İçe aktarma testlerinin örnek dosyaları. Aegis ve 2FAS örnekleri Aegis
# projesinin testlerinden (GPL-3.0, parolaları "test"), AES-GCM vektörleri bu
# örneklerden üretildi; içlerindeki anahtarlar herkese açık deneme verisidir.
# Cihaz testi aynı örnekleri gömülü olarak taşır. Liste bu dosyalarla sınırlı
# kalmalı; yeni bir örnek eklenirse önce içeriği gözden geçirilir.
[[allowlists]]
description = "İçe aktarma testlerinin herkese açık örnek dosyaları"
paths = [
  '''^test/fixtures/import/aegis_(plain|encrypted)\.json$''',
  '''^test/fixtures/import/2fas_(plain|encrypted)_v[0-9]+\.2fas$''',
  '''^test/fixtures/import/aes_gcm_vectors\.json$''',
  '''^integration_test/import_fixtures\.dart$''',
]

# Testlerdeki sabit deneme parolaları yanlış alarm veriyor. Dosyalara değil,
# yalnızca bu değerlere tam eşleşmeyle izin verilir; aynı dosyalardaki başka
# bir gizli bilgi yakalanmaya devam eder. Gerçek bir parola buraya eklenmez.
[[allowlists]]
description = "Testlerdeki sabit deneme parolaları"
regexes = [
  '''^dogru-Ana-Parola-47$''',
  '''^ikinci-Ana-Parola-58$''',
  '''^yepyeni-Ana-Parola-58$''',
  '''^yedek-Parolasi-55$''',
  '''^yedek-Alan-Parola-61$''',
  '''^yeni-Telefon-Parola-73$''',
]
