# fdroiddata'ya gönderilecek tarifin kopyası ve f-droid.yml iş akışının girdisi.
# İş akışı son derleme bloğunun commit, versionName ve versionCode alanlarını
# derlenen commit'e göre değiştirir. Tasarım: resources/docs/f-droid.md
#
# scanignore: sodium paketinin içindeki libsodium kaynak arşivi. Paketin
# derleme kancası libsodium'u bu kaynaktan NDK ile derler; arşiv silinirse
# derleme durur. Paket pubspec.lock'taki SHA-256 özetiyle doğrulanır.
Categories:
  - Password & 2FA
  - Security
License: GPL-3.0-only
AuthorName: aaudraa
SourceCode: https://github.com/aaudraa/KeyKey
IssueTracker: https://github.com/aaudraa/KeyKey/issues
Changelog: https://github.com/aaudraa/KeyKey/blob/HEAD/resources/CHANGELOG.md

AutoName: KeyKey

RepoType: git
Repo: https://github.com/aaudraa/KeyKey.git
Binaries: https://github.com/aaudraa/KeyKey/releases/download/v%v/keykey-%v.apk

Builds:
  - versionName: 1.0.1
    versionCode: 4
    commit: 6e4d97e2c64634f2a9e057fe9e44e8204e7d47d4
    sudo:
      - apt-get update
      - apt-get install -y make
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.9
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
    scanignore:
      - .pub-cache/hosted/pub.dev/sodium-*/3rdparty/libsodium-*-stable.tar.gz
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: r28c

AllowedAPKSigningKeys: 66ff7b5c0c009a8530d0a55dd1d80a3af35de48bd0667c456a0cf86a6d1129a0

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 4
